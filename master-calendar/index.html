;gap:15px}.card{border:1px solid var(--edge);background:var(--box);padding:18px;border-radius:17px}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:20px 0}.stat{background:var(--box);border:1px solid var(--edge);border-radius:14px;padding:15px}.stat strong{display:block;font-size:25px;line-height:1.2;margin:10px 0}.stat small{color:var(--dim)}.week,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week div{text-align:center;color:var(--dim);font-size:11px;margin-bottom:6px}.cell{min-height:75px;background:#192738;border:1px solid #304158;color:var(--light);border-radius:10px;text-align:left;padding:9px;display:flex;flex-direction:column;justify-content:space-between}.cell.off{visibility:hidden}.cell.sel{border-color:var(--mint);background:#1b3a32}.cell em{font-style:normal;font-size:10px;color:var(--dim)}.task{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #29394d;padding:12px 0}.task:first-of-type{border-top:0}.task input{margin-top:3px;accent-color:var(--mint);width:16px;height:16px}.tasktext{min-width:0;flex:1}.tasktext b{font-size:13px;line-height:1.4;display:block}.task.done .tasktext b{color:#9eb1c5;text-decoration:line-through}.meta{color:var(--dim);font-size:11px;margin-top:5px}.pill{font-size:10px;border-radius:15px;border:1px solid #3d5167;padding:2px 7px;display:inline-block;margin:3px 4px 0 0}.row{border-top:1px solid var(--edge);display:flex;justify-content:space-between;gap:10px;padding:12px 0}.row:first-child{border-top:0}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.auth{max-width:440px;width:100%;border:1px solid var(--edge);border-radius:18px;background:var(--box);padding:27px}.auth h1{font-size:27px}.auth input{width:100%;margin:7px 0 11px}.auth label{display:block;font-size:12px}.notice{border:1px solid #685331;color:#ffdc9e;background:#322919;border-radius:11px;padding:11px;margin:12px 0}.empty{color:var(--dim);text-align:center;padding:22px}.progress{height:12px;background:#2a3a4e;border-radius:20px;overflow:hidden}.progress div{height:100%;background:var(--mint)}#toast{position:fixed;bottom:16px;right:16px;z-index:5;max-width:330px;background:#32402f;border:1px solid #638968;color:white;border-radius:10px;padding:12px;display:none}
@media(max-width:950px){.shell{grid-template-columns:75px minmax(0,1fr)}.side{padding:12px 5px}.logo{font-size:13px;margin:8px 2px 20px;text-align:center}.logo small,.sidefoot{display:none}.nav button{font-size:11px;padding:10px 4px;text-align:center}.cols{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}

</style></head><body><div id="app"></div><div id="toast"></div><script>
(()=>{
const BASE='https://ejfrnjhlggebzmpmxajl.supabase.co',KEY='sb_publishable_COnNmCtI51j9CkXwa__gXQ_pLevKA_P';
const BEGIN='2026-11',END='2028-12',NAMES=['януари','февруари','март','април','май','юни','юли','август','септември','октомври','ноември','декември'];
const PROJECT={'dpp-bg':'DPP България','dpp-es':'DPP Испания','dpp-tech':'DPP Техника','enchev':'ENCHEV Auctions','restaurant':'Орешака Restaurant OS','mexico':'Мексикански сайт','operations':'Управление'};
let session=null,me=null,people=[],tasks=[],contracts=[],payments=[],leads=[],month=BEGIN,day='2026-11-01',view='calendar',filterPerson='all',filterProject='all';let invite=new URLSearchParams(location.search).get('invite');
const $=x=>document.querySelector(x),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),euro=n=>Number(n||0).toLocaleString('bg-BG',{maximumFractionDigits:2})+' €';
function tell(s){let e=$('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',4200)}
function keep(){session?localStorage.setItem('sfcal_auth',JSON.stringify(session)):localStorage.removeItem('sfcal_auth')}
async function api(path,method='GET',body,prefer){let headers={'apikey':KEY,'Content-Type':'application/json'};if(session?.access_token)headers.Authorization='Bearer '+session.access_token;if(prefer)headers.Prefer=prefer;let r=await fetch(BASE+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)}),s=await r.text();let data;try{data=s?JSON.parse(s):null}catch{data=s}if(!r.ok)throw Error(data?.message||data?.error_description||data?.error||'HTTP '+r.status);return data}
async function req(path,method='GET',body,prefer){try{return await api(path,method,body,prefer)}catch(e){if(session?.refresh_token&&/JWT|expired|token|401/i.test(e.message)){try{let n=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token});session=n;keep();return api(path,method,body,prefer)}catch{}}throw e}}
const rpc=(name,arg={})=>req('/rest/v1/rpc/'+name,'POST',arg);
function auth(){document.querySelector('#app').innerHTML='<div class="auth-wrap"><div class="auth"><div class="eyebrow">SOULFLAME · 2026–2028</div><h1>Master Calendar</h1><p class="dim">Защитен календар за Митко, Борко, Енчо и екипа.</p>'+(invite?'<div class="notice">Имаш лична покана. Регистрирай се или влез, за да я активираш.</div>':'')+'<form id="login"><label>Имейл</label><input class="inp" type="email" name="email" required><label>Парола (8+ знака)</label><input class="inp" type="password" name="password" minlength="8" required><button class="btn primary" type="submit">Вход</button> <button class="btn secondary" type="button" id="signup">Регистрация</button></form><p class="dim" style="font-size:12px">При първа регистрация може да е нужно потвърждение на имейла.</p></div></div>';$('#login').onsubmit=async(ev)=>{ev.preventDefault();const f=new FormData(ev.target);try{session=await api('/auth/v1/token?grant_type=password','POST',{email:f.get('email'),password:f.get('password')});keep();await init()}catch(e){tell(e.message)}};$('#signup').onclick=async()=>{let f=new FormData($('#login'));try{let r=await api('/auth/v1/signup','POST',{email:f.get('email'),password:f.get('password')});tell(r?.access_token?'Регистриран. Влез.':'Регистрацията е изпратена. Потвърди имейла си.') }catch(e){tell(e.message)}}}
function setup(){let body=invite?'<p>Потвърди личната си покана.</p><button id="redeem" class="btn primary">Приеми поканата</button>':'<p>Първо активиране от собственика. Въведи еднократния администраторски код.</p><input type="password" id="activation" class="inp" placeholder="Код"><button class="btn primary" id="claim">Активирай</button>';$('#app').innerHTML='<div class="auth-wrap"><div class="auth"><div class="eyebrow">SOULFLAME</div><h1>Свържи профила</h1>'+body+'<p><button id="logout" class="btn secondary">Изход</button></p></div></div>';$('#logout').onclick=logout;if(invite){$('#redeem').onclick=async()=>{try{await rpc('sfcal_accept_invite',{p_token:invite});history.replaceState({},'',location.pathname);invite=null;await init()}catch(e){tell(e.message)}}}else{$('#claim').onclick=async()=>{try{await rpc('sfcal_claim_admin',{secret:$('#activation').value.trim()});let n=await rpc('sfcal_seed_initial_tasks');tell('Зареден календар: '+n+' задачи.');await init()}catch(e){tell(e.message)}}}}
async function logout(){session=null;me=null;keep();auth()}
async function init(){if(!session){auth();return}try{let p=await req('/rest/v1/sfcal_people?select=id,name,role,active&user_id=eq.'+session.user.id);me=p?.[0]||null;if(!me){setup();return}await load();render()}catch(e){tell('Грешка: '+e.message)}}
const admin=()=>me?.role==='admin';
async function load(){let end=new Date(Date.UTC(+month.slice(0,4),+month.slice(5,7),0)).toISOString().slice(0,10);let [p,t,c,pa,l]=await Promise.all([
req('/rest/v1/sfcal_people?select=id,name,role,active,user_id&order=created_at.asc'),
req('/rest/v1/sfcal_tasks?select=*&task_date=gte.'+month+'-01&task_date=lte.'+end+'&order=task_date.asc,task_time.asc&limit=900'),
admin()?req('/rest/v1/sfcal_contracts?select=*&order=updated_at.desc'):[],
admin()?req('/rest/v1/sfcal_payments?select=*&order=payment_date.desc'):[],
req('/rest/v1/sfcal_leads?select=*&limit=300')
]);people=p;tasks=t;contracts=c;payments=pa;leads=l}
function monthName(){let [y,m]=month.split('-').map(Number);return NAMES[m-1][0].toUpperCase()+NAMES[m-1].slice(1)+' '+y}
const person=x=>people.find(p=>p.id===x)?.name||'Неназначен';
function shown(t){return (filterPerson==='all'||t.owner_id===filterPerson)&&(filterProject==='all'||t.project===filterProject)}
function stat(l,v,n){return '<div class="stat"><small>'+safe(l)+'</small><strong>'+safe(v)+'</strong><small>'+safe(n)+'</small></div>'}
function task(t){let done=t.status==='done';return '<div class="task '+(done?'done':'')+'"><input type="checkbox" data-done="'+safe(t.id)+'" '+(done?'checked':'')+'><div class="tasktext"><b>'+safe(t.title)+'</b><div class="meta">'+safe(t.task_time)+' · '+safe(PROJECT[t.project]||t.project)+(admin()?' · '+safe(person(t.owner_id)):'')+'</div><span class="pill">'+safe(({todo:'Предстои',in_progress:'В работа',blocked:'Блокирано',done:'Готово'})[t.status]||t.status)+'</span><details><summary class="dim" style="font-size:11px;cursor:pointer">Условие за завършване</summary><p style="font-size:12px">'+safe(t.acceptance)+'</p><p class="dim" style="font-size:12px">'+safe(t.description)+'</p></details></div><button class="btn small secondary" data-status="'+safe(t.id)+'">Статус</button>'+(admin()?'<button class="btn small secondary" data-edit="'+safe(t.id)+'">✎</button>':'')+'</div>'}
function calendar(){let[y,m]=month.split('-').map(Number),n=new Date(Date.UTC(y,m,0)).getUTCDate(),shift=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7;let h='<div class="week">'+['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(v=>'<div>'+v+'</div>').join('')+'</div><div class="cal">';for(let i=0;i<Math.ceil((n+shift)/7)*7;i++){let d=i-shift+1;if(d<1||d>n){h+='<span class="cell off"></span>';continue}let date=month+'-'+String(d).padStart(2,'0'),a=tasks.filter(t=>t.task_date===date&&shown(t));h+='<button class="cell '+(day===date?'sel':'')+'" data-date="'+date+'"><b>'+d+'</b><em>'+(a.length?a.filter(t=>t.status==='done').length+'/'+a.length+' задачи':'–')+'</em></button>'}return h+'</div>'}
function selectors(){return '<div class="filters"><select id="proj" class="inp"><option value="all">Всички проекти</option>'+Object.entries(PROJECT).map(([v,n])=>'<option value="'+v+'" '+(filterProject===v?'selected':'')+'>'+safe(n)+'</option>').join('')+'</select>'+(admin()?'<select id="person" class="inp"><option value="all">Всички хора</option>'+people.map(p=>'<option value="'+p.id+'" '+(filterPerson===p.id?'selected':'')+'>'+safe(p.name)+'</option>').join('')+'</select>':'')+'</div>'}
function calendarView(){let visible=tasks.filter(shown),today=visible.filter(t=>t.task_date===day);return '<div class="eyebrow">SOULFLAME · ДНЕВЕН МАСТЪРПЛАН</div><h1>Календар ден по ден</h1><div class="dim">1 ноември 2026 – 31 декември 2028 · реални задачи и отговорници</div><div class="stats">'+stat('Задачи в месеца',visible.length,'Разпределени')+stat('Изпълнени',visible.filter(t=>t.status==='done').length,'Потвърдени')+stat('Избран ден',day.slice(8)+' '+NAMES[+day.slice(5,7)-1],'Следвай дневния план')+stat('Блокирани',visible.filter(t=>t.status==='blocked').length,'За действие')+'</div><div class="actions"><button class="btn secondary" data-move="-1">←</button><b>'+monthName()+'</b><button class="btn secondary" data-move="1">→</button>'+selectors()+'</div><div class="cols"><div class="card">'+calendar()+'<p class="dim" style="font-size:11px">Събота и неделя: отчет и подготовка. Обажданията са в работните дни.</p></div><div class="card"><div class="cardhead"><h2>'+day+'</h2><span class="pill">'+today.filter(x=>x.status==='done').length+'/'+today.length+'</span></div>'+(today.length?today.map(task).join(''):'<div class="empty">Няма задачи за този ден.</div>')+'</div></div>'}
function tasksView(){let a=tasks.filter(shown);return '<div class="eyebrow">SOULFLAME · ИЗПЪЛНЕНИЕ</div><h1>Задачи · '+monthName()+'</h1><div class="actions"><button class="btn secondary" data-move="-1">←</button><button class="btn secondary" data-move="1">→</button>'+selectors()+'</div><div class="card">'+(a.length?a.map(task).join(''):'<div class="empty">Няма възложени задачи.</div>')+'</div>'}
function teamView(){return '<div class="eyebrow">АДМИНИСТРАТОР</div><h1>Хора и лични линкове</h1><button class="btn primary" id="add-person">+ Добави човек</button><div class="card" style="margin-top:17px">'+people.map(p=>'<div class="row"><div><b>'+safe(p.name)+'</b><div class="dim">'+(p.role==='admin'?'Администратор':p.user_id?'Активен профил':'Чака покана')+'</div></div>'+(p.role==='member'&&!p.user_id?'<button class="btn small" data-invite="'+p.id+'">Копирай личен линк</button>':'')+'</div>').join('')+'<p class="dim" style="font-size:12px">Поканите са еднократни и изтичат след 14 дни. Служителите виждат само собствените задачи.</p></div>'}
function moneyView(){let signed=contracts.filter(c=>c.confirmed&&c.active),recurring=signed.reduce((s,c)=>s+Number(c.amount),0),pipeline=contracts.filter(c=>!c.confirmed&&c.active).reduce((s,c)=>s+Number(c.amount),0),paid=payments.filter(x=>x.payment_date.startsWith(month)).reduce((s,p)=>s+Number(p.amount),0);return '<div class="eyebrow">ФИНАНСОВ КОНТРОЛ</div><h1>Договори и реални плащания</h1><div class="stats">'+stat('Въведени подписани',signed.length,'Активни договори')+stat('Договорени абонаменти',euro(recurring),'По въведени данни')+stat('Получени през '+month,euro(paid),'По въведени плащания')+stat('Непотвърден интерес',euro(pipeline),'Не е приход')+'</div><div class="card"><h2>Отчет без предположения</h2><p class="dim">Планираните сделки не са приходи. Данните се въвеждат ръчно и се проверяват с договори и банкови документи.</p></div><div class="cols" style="margin-top:14px"><div class="card"><div class="cardhead"><h2>Договори</h2><button class="btn" id="add-contract">+ Договор</button></div>'+(contracts.length?contracts.map(c=>'<div class="row"><span>'+safe(c.name)+' <small class="dim">'+safe(c.confirmed?'подписан':'планиран')+'</small></span><b>'+euro(c.amount)+'</b></div>').join(''):'<div class="empty">Няма въведени договори.</div>')+'</div><div class="card"><div class="cardhead"><h2>Плащания</h2><button class="btn" id="add-payment">+ Плащане</button></div>'+payments.filter(p=>p.payment_date.startsWith(month)).map(p=>'<div class="row"><span>'+safe(p.name)+'<div class="dim">'+safe(p.payment_date)+'</div></span><b>'+euro(p.amount)+'</b></div>').join('')+'</div></div>'}
function leadsView(){return '<div class="eyebrow">ПРОДАЖБИ</div><h1>Потенциални клиенти</h1>'+(admin()?'<button id="add-lead" class="btn primary">+ Добави фирма</button>':'')+'<div class="card" style="margin-top:15px">'+(leads.length?leads.map(l=>'<div class="row"><div><b>'+safe(l.company)+'</b><div class="dim">'+safe(PROJECT[l.project]||l.project)+' · '+safe(l.stage)+' · '+safe(l.contact)+'</div><div>Следващо: '+safe(l.next_action)+'</div></div></div>').join(''):'<div class="empty">Запиши първите реални фирмени контакти от дневните задачи.</div>')+'</div>'}
function render(){let nav=[['calendar','▦ Календар'],['tasks','☑ Задачи'],['leads','◉ Контакти']];if(admin())nav.push(['team','♙ Екип'],['money','€ Приходи']);$('#app').innerHTML='<div class="shell"><aside class="side"><div class="logo">✦ SOUL<span>FLAME</span><small>MASTER CALENDAR</small></div><nav class="nav">'+nav.map(([id,n])=>'<button data-tab="'+id+'" class="'+(view===id?'sel':'')+'">'+n+'</button>').join('')+'</nav><div class="sidefoot"><b>'+safe(me.name)+'</b><p>'+safe(admin()?'Администратор':'Само лични задачи')+'</p>01.11.2026 – 31.12.2028</div></aside><div class="main"><div class="topbar"><b>SOULFLAME <span class="dim">/ '+safe(view)+'</span></b><div><span class="dim">'+safe(me.name)+' </span><button id="reload" class="btn small secondary">↻</button> <button id="logout" class="btn small secondary">Изход</button></div></div><main class="content">'+({calendar:calendarView,tasks:tasksView,team:teamView,money:moneyView,leads:leadsView}[view]||calendarView)()+'<div class="actions">'+(admin()?'<button id="new-task" class="btn">+ Възложи задача</button>':'')+'<button id="export" class="btn secondary">Експорт CSV на месеца</button></div></main></div></div>'}
async function changeStatus(t,done){let s=done!==undefined?(done?'done':'todo'):prompt('Статус: todo / in_progress / blocked / done',t.status);if(s===null)return;let note=done===undefined?prompt('Кратка бележка/доказателство',t.description||''):null;try{await rpc('sfcal_update_status',{p_task_id:t.id,p_status:s,p_note:note});t.status=s;if(note!==null)t.description=note;render()}catch(e){tell(e.message)}}
async function editTask(t){let title=prompt('Точна задача:',t?.title||'');if(!title)return;let date=prompt('Дата YYYY-MM-DD',t?.task_date||day);if(!date||date<'2026-11-01'||date>'2028-12-31'||!/^\d{4}-\d{2}-\d{2}$/.test(date))return tell('Невалидна дата');let who=prompt('Отговорник по име ('+people.map(p=>p.name).join(', ')+')',t?person(t.owner_id):'Митко');let pp=people.find(p=>p.name.toLowerCase()===who?.toLowerCase());if(!pp)return tell('Няма такъв член');let pr=prompt('Проект: '+Object.keys(PROJECT).join(', '),t?.project||'operations');if(!PROJECT[pr])return tell('Невалиден проект');let acceptance=prompt('Как доказваме изпълнението?',t?.acceptance||'Реален проверим резултат');if(acceptance===null)return;let payload={id:t?.id||'manual:'+Date.now(),task_date:date,task_time:t?.task_time||'11:00',project:pr,title,owner_id:pp.id,status:t?.status||'todo',priority:'normal',acceptance,description:t?.description||''};try{await req('/rest/v1/sfcal_tasks?on_conflict=id','POST',[payload],'resolution=merge-duplicates,return=minimal');month=date.slice(0,7);day=date;await load();render();tell('Задачата е записана за '+pp.name)}catch(e){tell(e.message)}}
async function newPerson(){let name=prompt('Име на човека');if(!name?.trim())return;try{await req('/rest/v1/sfcal_people','POST',{name:name.trim(),role:'member'},'return=minimal');await load();render()}catch(e){tell(e.message)}}
async function newInvite(id){try{let tok=await rpc('sfcal_create_invite',{p_person_id:id});let link=location.origin+'/?invite='+tok;try{await navigator.clipboard.writeText(link)}catch{}prompt('Копирай и изпрати личния линк:',link)}catch(e){tell(e.message)}}
async function newContract(){let name=prompt('Компания / клиент');if(!name)return;let project=prompt('Проект: '+Object.keys(PROJECT).join(', '),'dpp-bg');if(!PROJECT[project])return tell('Невалиден проект');let amount=Number(prompt('Месечен абонамент €',500));if(!Number.isFinite(amount)||amount<0)return tell('Невалидна сума');let confirmed=confirm('Има ли ПОДПИСАН договор? Отказ = само планиран.');try{await req('/rest/v1/sfcal_contracts','POST',{name,project,amount,confirmed,active:true},'return=minimal');await load();render()}catch(e){tell(e.message)}}
async function newPayment(){let name=prompt('Основание за РЕАЛНО получено плащане');if(!name)return;let amount=Number(prompt('Реално получена сума €'));if(!Number.isFinite(amount)||amount<=0)return;let date=prompt('Дата YYYY-MM-DD',new Date().toISOString().slice(0,10));let category=prompt('recurring / milestone / other','recurring');try{await req('/rest/v1/sfcal_payments','POST',{name,amount,payment_date:date,category},'return=minimal');await load();render()}catch(e){tell(e.message)}}
async function newLead(){let company=prompt('Фирма');if(!company)return;let project=prompt('Проект: dpp-bg / dpp-es / enchev / restaurant / mexico','dpp-bg');if(!PROJECT[project])return;let contact=prompt('Лице за контакт','')||'',phone=prompt('Телефон (ако е проверен)','')||'',next_action=prompt('Следващо действие','')||'';let assigned=project==='dpp-es'?people.find(x=>x.name==='Енчо')?.id:people.find(x=>x.name==='Митко')?.id;try{await req('/rest/v1/sfcal_leads','POST',{company,project,contact,phone,next_action,assigned_id:assigned},'return=minimal');await load();render()}catch(e){tell(e.message)}}
function exportMonth(){let cols=['task_date','task_time','title','project','status','acceptance','description'];let csv='\ufeff'+[cols,...tasks.map(t=>cols.map(k=>t[k]))].map(row=>row.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='SOULFLAME-'+month+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
document.addEventListener('click',async e=>{let x=e.target.closest('[data-tab],[data-date],[data-move],[data-status],[data-edit],#logout,#reload,#add-person,[data-invite],#add-contract,#add-payment,#add-lead,#new-task,#export');if(!x)return;try{if(x.id==='logout')return logout();if(x.id==='reload'){await load();return render()}if(x.dataset.tab){view=x.dataset.tab;return render()}if(x.dataset.date){day=x.dataset.date;return render()}if(x.dataset.move){let[y,m]=month.split('-').map(Number),n=new Date(Date.UTC(y,m-1+Number(x.dataset.move),1)).toISOString().slice(0,7);if(n<BEGIN||n>END)return tell('Календарът е от ноември 2026 до декември 2028');month=n;day=n+'-01';await load();return render()}if(x.dataset.status)return changeStatus(tasks.find(t=>t.id===x.dataset.status));if(x.dataset.edit)return editTask(tasks.find(t=>t.id===x.dataset.edit));if(x.id==='add-person')return newPerson();if(x.dataset.invite)return newInvite(x.dataset.invite);if(x.id==='new-task')return editTask(null);if(x.id==='add-contract')return newContract();if(x.id==='add-payment')return newPayment();if(x.id==='add-lead')return newLead();if(x.id==='export')return exportMonth()}catch(err){tell(err.message)}});

 let mt=demoMonthTasks();return '<div class="stats">'+stat('Задачи за месеца',mt.length,'От '+demoGenerated.length+' планирани')+stat('Изпълнени',mt.filter(t=>t.status==='done').length,'На това устройство')+stat('Избран ден',demoDay.slice(8)+' '+NAMES[+demoDay.slice(5,7)-1],'Стъпки и контрол')+stat('Блокирани',mt.filter(t=>t.status==='blocked').length,'За действие')+'</div>';
}
function demoBody(){
 if(demoTab==='calendar'){
  let a=demoDateTasks();
  return '<h1>Календар ден по ден</h1><p class="dim">792 дни · ноември 2026 – декември 2028 · задачи за Митко, Борко и Енчо</p>'+demoStats()+'<div class="actions"><button class="btn secondary" data-demo-move="-1">←</button><b>'+demoMonthTitle()+'</b><button class="btn secondary" data-demo-move="1">→</button>'+demoFilters()+'<button class="btn primary" data-demo-action="newtask">+ Задача</button></div><div class="cols"><div class="card">'+demoCalendar()+'<p class="dim" style="font-size:11px">Дните през уикенда са за преглед и планиране. Работните дни са за контакти, демота и технически тестове.</p></div><div class="card"><div class="cardhead"><h2>'+demoDay+'</h2><span class="pill">'+a.filter(t=>t.status==='done').length+'/'+a.length+' готови</span></div>'+a.map(demoTaskCard).join('')+'</div></div>';
 }
 if(demoTab==='tasks'){
  let a=demoMonthTasks();
  return '<h1>Задачи · '+demoMonthTitle()+'</h1><div class="actions"><button class="btn secondary" data-demo-move="-1">←</button><button class="btn secondary" data-demo-move="1">→</button>'+demoFilters()+'<button class="btn primary" data-demo-action="newtask">+ Задача</button></div><div class="card">'+a.map(demoTaskCard).join('')+'</div>';
 }
 if(demoTab==='team'){
  return '<h1>Екип и лични линкове</h1><div class="actions"><button class="btn primary" data-demo-action="addperson">+ Добави човек</button></div><div class="card">'+demoStore.people.map(p=>'<div class="row"><div><b>'+safe(p)+'</b><div class="dim">Задачи по име</div></div><button class="btn small secondary" data-demo-share="'+safe(p)+'">Копирай линк</button></div>').join('')+'<p class="dim">Всеки линк показва задачите на избрания човек, без вход. <b>Това не е защитен личен акаунт</b>; получените отметки не се връщат автоматично при теб. За истинска обща работа трябва защитен достъп.</p></div>';
 }
 if(demoTab==='money'){
 const signed=demoStore.contracts.filter(x=>x.confirmed&&x.active),r=signed.reduce((n,x)=>n+Number(x.amount),0),pipeline=demoStore.contracts.filter(x=>!x.confirmed&&x.active).reduce((n,x)=>n+Number(x.amount),0),p=demoStore.payments.filter(x=>x.date.startsWith(demoMonth)).reduce((n,x)=>n+Number(x.amount),0);
 return '<h1>Приходи и договори</h1><div class="stats">'+stat('Въведени подписани',signed.length,'Активни')+stat('Договорени абонаменти',euro(r),'По въведени данни')+stat('Получени плащания',euro(p),demoMonthTitle())+stat('Непотвърден интерес',euro(pipeline),'Не е приход')+'</div><div class="card"><h2>Отчет без предположения</h2><p class="dim">Няма фиксиран оборот. Показани са само въведени договори и плащания. Режимът е локален; проверявай данните с оригиналните документи.</p></div><div class="cols" style="margin-top:14px"><div class="card"><div class="cardhead"><h2>Договори</h2><button class="btn primary" data-demo-action="contract">+ Договор</button></div>'+demoStore.contracts.map(x=>'<div class="row"><span>'+safe(x.name)+' · '+(x.confirmed?'подписан':'планиран')+'</span><b>'+euro(x.amount)+'</b></div>').join('')+'</div><div class="card"><div class="cardhead"><h2>Получени плащания</h2><button class="btn primary" data-demo-action="payment">+ Плащане</button></div>'+demoStore.payments.filter(x=>x.date.startsWith(demoMonth)).map(x=>'<div class="row"><span>'+safe(x.name)+' · '+safe(x.date)+'</span><b>'+euro(x.amount)+'</b></div>').join('')+'</div></div>';
 }
 if(demoTab==='leads'){
  return '<h1>Фирми и разговори</h1><p class="dim">Въвеждай само реални контакти. Не въвеждай чувствителни клиентски данни в този тестов режим.</p><button class="btn primary" data-demo-action="lead">+ Добави фирма</button><div class="card" style="margin-top:14px">'+(demoStore.leads.length?demoStore.leads.map(x=>'<div class="row"><div><b>'+safe(x.name)+'</b><div class="dim">'+safe(x.project)+' · '+safe(x.stage)+'</div><p>'+safe(x.next)+'</p></div></div>').join(''):'<div class="empty">Още няма записани разговори.</div>')+'</div>';
 }
 return '';
}
function demoRender(){document.getElementById('app').innerHTML=demoLayout()}
function demoMove(delta){const [y,m]=demoMonth.split('-').map(Number);let next=new Date(Date.UTC(y,m-1+delta,1)).toISOString().slice(0,7);if(next<'2026-11'||next>'2028-12'){tell('Диапазонът е 11.2026–12.2028');return}demoMonth=next;demoDay=next+'-01';demoRender()}
function demoEdit(id){
 let t=id?demoAll().find(x=>x.id===id):null;
 let title=prompt('Задача:',t?.title||'');if(!title)return;
 let date=prompt('Дата YYYY-MM-DD:',t?.task_date||demoDay);if(!date||date<DEMO_START||date>DEMO_END||!/^\\d{4}-\\d{2}-\\d{2}$/.test(date))return tell('Невалидна дата');
 let owner=prompt('Отговорник ('+demoStore.people.join(', ')+')',t?.owner||'Митко');if(!demoStore.people.includes(owner))return tell('Добави първо човека в „Екип“');
 let project=prompt('Проект: '+Object.keys(PROJECT_DEMO).join(', '),t?.project||'operations');if(!PROJECT_DEMO[project])return tell('Невалиден проект');
 let acceptance=prompt('Как доказваме, че е изпълнено?',t?.acceptance||'Проверим резултат');if(acceptance===null)return;
 let change={title,task_date:date,owner,project,acceptance};
 if(id){demoStore.edits[id]=Object.assign({},demoStore.edits[id]||{},change)}
 else{demoStore.extra.push(Object.assign({id:'custom:'+Date.now()+':'+Math.random().toString(36).slice(2),task_time:'11:00',status:'todo',description:''},change))}
 demoMonth=date.slice(0,7);demoDay=date;demoSave();demoRender();
}
document.addEventListener('click',async ev=>{
 let el=ev.target.closest('[data-demo-tab],[data-demo-date],[data-demo-move],[data-demo-action],[data-demo-status],[data-demo-edit],[data-demo-share]');
 if(!el)return;
 if(el.dataset.demoTab){demoTab=el.dataset.demoTab;return demoRender()}
 if(el.dataset.demoDate){demoDay=el.dataset.demoDate;return demoRender()}
 if(el.dataset.demoMove){return demoMove(Number(el.dataset.demoMove))}
 if(el.dataset.demoEdit){return demoEdit(el.dataset.demoEdit)}
 if(el.dataset.demoStatus){let id=el.dataset.demoStatus,t=demoAll().find(x=>x.id===id);if(!t)return;let s=prompt('Статус: todo / in_progress / blocked / done',t.status);if(s===null)return;if(!['todo','in_progress','blocked','done'].includes(s))return tell('Невалиден статус');let note=prompt('Бележка по задачата',t.description||'');demoStore.states[id]=s;if(note!==null)demoStore.edits[id]=Object.assign({},demoStore.edits[id]||{},{description:note});demoSave();return demoRender()}
 if(el.dataset.demoShare){let url=location.origin+location.pathname+'?person='+encodeURIComponent(el.dataset.demoShare);try{await navigator.clipboard.writeText(url)}catch{}prompt('Копирай линк за '+el.dataset.demoShare+' (без синхронизация):',url);return}
 const action=el.dataset.demoAction;
 if(action==='resetfilter'){demoMode='Всички';history.replaceState({},'',location.pathname);return demoRender()}
 if(action==='newtask')return demoEdit(null);
 if(action==='addperson'){let name=prompt('Име на новия човек');if(!name?.trim()||demoStore.people.includes(name.trim()))return;demoStore.people.push(name.trim().slice(0,70));demoSave();return demoRender()}
 if(action==='contract'){
  let name=prompt('Клиент/фирма');if(!name)return;let amt=Number(prompt('Месечен абонамент €','500'));if(!Number.isFinite(amt)||amt<0)return tell('Невалидна сума');let confirmed=confirm('Има ли реално подписан договор? Отказ = само планиран.');demoStore.contracts.push({name,amount:amt,confirmed,active:true});demoSave();return demoRender()
 }
 if(action==='payment'){
  let name=prompt('Основание за получено плащане');if(!name)return;let amt=Number(prompt('Реално получена сума €'));if(!Number.isFinite(amt)||amt<=0)return tell('Невалидна сума');let date=prompt('Дата YYYY-MM-DD',demoDay);if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return tell('Невалидна дата');demoStore.payments.push({name,amount:amt,date});demoSave();return demoRender()
 }
 if(action==='lead'){
  let name=prompt('Компания');if(!name)return;let project=prompt('Проект','dpp-bg')||'dpp-bg',stage=prompt('Статус на разговора','Нов контакт')||'',next=prompt('Следваща стъпка','')||'';demoStore.leads.push({name,project,stage,next});demoSave();return demoRender()
 }
});
document.addEventListener('change',ev=>{
 let x=ev.target;
 if(x.dataset.demoCheck){demoStore.states[x.dataset.demoCheck]=x.checked?'done':'todo';demoSave();demoRender()}
 if(x.id==='demo-person'){demoMode=x.value;demoRender()}
 if(x.id==='demo-project'){demoProject=x.value;demoRender()}
});

try{session=JSON.parse(localStorage.getItem('sfcal_auth')||'null')}catch{}
if(new URLSearchParams(location.search).get('secure')==='1'){init()}else{demoRender()}
})();
</script></body></html>
